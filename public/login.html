<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RemoteCMD 登录</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #e6ecf5 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1a1f36;
  }
  .card {
    width: 340px;
    max-width: 90vw;
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(50, 60, 90, 0.12);
  }
  .card h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
  }
  .card .sub {
    margin: 0 0 24px;
    font-size: 13px;
    color: #6b7280;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: #3c4257;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d6dae3;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #4f7cff; }
  .btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #4f7cff;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #3f6af0; }
  .btn:active { background: #3560e0; }
  .error {
    margin-top: 14px;
    font-size: 13px;
    color: #d64545;
    min-height: 18px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>RemoteCMD</h1>
    <p class="sub">请输入账号密码以继续</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="用户名" autocomplete="off">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="密码" autocomplete="off">
      </div>
      <button class="btn" type="submit">登录</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const resp = await fetch('api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.ok) {
          location.href = data.redirect || (location.pathname.replace(/\/[^/]*$/, '') + '/');
          return;
        }
        errEl.textContent = data.error || '登录失败';
      } catch (e) {
        errEl.textContent = '网络错误，请重试';
      }
    });
  </script>
</body>
</html>
